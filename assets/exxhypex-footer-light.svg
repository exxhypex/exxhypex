<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc"><title id="title">Powered by curiosity</title><desc id="desc">A subtle light glass panel with a gently pulsing cyan line.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5fbff"/><stop offset="1" stop-color="#e8f5fa"/></linearGradient><linearGradient id="shine"><stop stop-color="#1686a8" stop-opacity="0"/><stop offset=".5" stop-color="#258eae" stop-opacity=".8"/><stop offset="1" stop-color="#1686a8" stop-opacity="0"/></linearGradient></defs><rect x="2" y="2" width="1196" height="186" rx="24" fill="url(#bg)" stroke="#69bad1" stroke-opacity=".6"/><rect x="18" y="18" width="1164" height="154" rx="18" fill="#fff" fill-opacity=".55"/><path d="M80 55 H1120" stroke="url(#shine)" stroke-width="1.5"><animate attributeName="opacity" values=".35;1;.35" dur="6s" repeatCount="indefinite"/></path><text x="600" y="105" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" letter-spacing="4" fill="#173c50">POWERED BY CURIOSITY</text><text x="600" y="137" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="3" fill="#147d9e">EXXHYPEX · EXPLORE / EXPERIMENT / BUILD</text></svg>