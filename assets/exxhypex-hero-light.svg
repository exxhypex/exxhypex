<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">EXXHYPEX — Explore, experiment, build</title><desc id="desc">Light glass-inspired banner with softly animated cyan orbs and a luminous outline.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5fbff"/><stop offset=".55" stop-color="#eaf6fb"/><stop offset="1" stop-color="#f8fcff"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#c9f0fa" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient><linearGradient id="line"><stop stop-color="#1686a8" stop-opacity=".04"/><stop offset=".5" stop-color="#38a9cb" stop-opacity=".65"/><stop offset="1" stop-color="#1686a8" stop-opacity=".04"/></linearGradient><radialGradient id="orb"><stop stop-color="#66d8f2" stop-opacity=".55"/><stop offset="1" stop-color="#66d8f2" stop-opacity="0"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="22"/></filter></defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/><circle cx="180" cy="70" r="145" fill="url(#orb)" filter="url(#blur)"><animate attributeName="cx" values="180;245;180" dur="18s" repeatCount="indefinite"/></circle><circle cx="1030" cy="300" r="180" fill="url(#orb)" filter="url(#blur)"><animate attributeName="cy" values="300;245;300" dur="22s" repeatCount="indefinite"/></circle><rect x="18" y="18" width="1164" height="324" rx="22" fill="url(#glass)" stroke="#69bad1" stroke-opacity=".48"/><path d="M42 88 H1158 M42 275 H1158" stroke="url(#line)" stroke-width="1"/><g fill="none" stroke="#258eae" stroke-opacity=".2"><circle cx="1050" cy="105" r="55"><animate attributeName="r" values="55;62;55" dur="9s" repeatCount="indefinite"/></circle><circle cx="1050" cy="105" r="82" stroke-dasharray="3 10"><animateTransform attributeName="transform" type="rotate" from="0 1050 105" to="360 1050 105" dur="55s" repeatCount="indefinite"/></circle><circle cx="150" cy="275" r="40" stroke-dasharray="2 8"><animateTransform attributeName="transform" type="rotate" from="360 150 275" to="0 150 275" dur="45s" repeatCount="indefinite"/></circle></g><g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle"><text x="600" y="163" font-size="72" font-weight="750" letter-spacing="5" fill="#102d40">EXXHYPEX</text><text x="600" y="207" font-size="17" letter-spacing="5" fill="#147d9e">EXPLORE / EXPERIMENT / BUILD</text><text x="600" y="245" font-size="13" letter-spacing="2.5" fill="#486477">A PERSONAL SPACE FOR TECHNOLOGY &amp; OPEN SOURCE</text></g><circle cx="90" cy="180" r="3" fill="#1686a8"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle><circle cx="1110" cy="230" r="2.5" fill="#1686a8"><animate attributeName="opacity" values="1;.25;1" dur="5s" repeatCount="indefinite"/></circle></svg>