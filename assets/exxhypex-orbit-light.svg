<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="title desc"><title id="title">EXXHYPEX glass orbit emblem</title><desc id="desc">A glass-like circular emblem with a slowly orbiting cyan point.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#8ed9ec" stop-opacity=".16"/></linearGradient><radialGradient id="glow"><stop stop-color="#5ac8e5" stop-opacity=".3"/><stop offset="1" stop-color="#5ac8e5" stop-opacity="0"/></radialGradient></defs><circle cx="120" cy="120" r="104" fill="url(#glow)"/><circle cx="120" cy="120" r="82" fill="url(#g)" stroke="#4da9c3" stroke-opacity=".65"/><circle cx="120" cy="120" r="66" fill="none" stroke="#268eae" stroke-opacity=".4" stroke-dasharray="3 8"/><ellipse cx="120" cy="120" rx="91" ry="34" fill="none" stroke="#258eae" stroke-opacity=".65" transform="rotate(-32 120 120)"/><ellipse cx="120" cy="120" rx="91" ry="34" fill="none" stroke="#258eae" stroke-opacity=".28" transform="rotate(48 120 120)"/><text x="120" y="139" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="57" font-weight="800" letter-spacing="-4" fill="#173c50">X</text><g><circle cx="0" cy="0" r="6" fill="#1686a8"/><animateMotion dur="14s" repeatCount="indefinite" path="M 120,29 A 91,34 -32 1 1 119.9,29"/></g><circle cx="120" cy="120" r="82" fill="none" stroke="#258eae" stroke-opacity=".2"><animate attributeName="stroke-opacity" values=".08;.35;.08" dur="7s" repeatCount="indefinite"/></circle></svg>