<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">EXXHYPEX technology orbit</title>
  <desc id="desc">A central EXXHYPEX hub surrounded by four orbiting domains: Android, Linux, AI Lab and Software.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b2a"/>
      <stop offset="1" stop-color="#102c40"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4bd8f5" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#70e4ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#9a8cff" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174b64"/>
      <stop offset="1" stop-color="#172b52"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="984" height="404" rx="28" fill="url(#panel)" stroke="#66dff8" stroke-opacity=".28"/>
  <g fill="none" stroke="url(#orbit)">
    <ellipse cx="500" cy="210" rx="330" ry="148" stroke-width="2.2"/>
    <ellipse cx="500" cy="210" rx="245" ry="104" stroke-width="1.2" stroke-dasharray="4 9" opacity=".6" transform="rotate(-28 500 210)"/>
    <ellipse cx="500" cy="210" rx="245" ry="104" stroke-width="1.2" stroke-dasharray="4 9" opacity=".6" transform="rotate(28 500 210)"/>
  </g>

  <g fill="#8cecff" opacity=".8">
    <circle cx="500" cy="62" r="3"/><circle cx="830" cy="210" r="3"/>
    <circle cx="500" cy="358" r="3"/><circle cx="170" cy="210" r="3"/>
  </g>

  <!-- Static orbital nodes: these remain visible if SVG animation is disabled. -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g>
      <circle cx="500" cy="62" r="52" fill="#12384c" stroke="#62dff8" stroke-width="1.8"/>
      <circle cx="500" cy="62" r="43" fill="none" stroke="#8cecff" stroke-opacity=".28" stroke-dasharray="3 6"/>
      <text x="500" y="55" fill="#8cecff" font-size="11" font-weight="700" letter-spacing="2">01</text>
      <text x="500" y="76" fill="#effcff" font-size="17" font-weight="700">ANDROID</text>
    </g>
    <g>
      <circle cx="830" cy="210" r="52" fill="#12384c" stroke="#62dff8" stroke-width="1.8"/>
      <circle cx="830" cy="210" r="43" fill="none" stroke="#8cecff" stroke-opacity=".28" stroke-dasharray="3 6"/>
      <text x="830" y="203" fill="#8cecff" font-size="11" font-weight="700" letter-spacing="2">02</text>
      <text x="830" y="224" fill="#effcff" font-size="17" font-weight="700">LINUX</text>
    </g>
    <g>
      <circle cx="500" cy="358" r="52" fill="#12384c" stroke="#62dff8" stroke-width="1.8"/>
      <circle cx="500" cy="358" r="43" fill="none" stroke="#8cecff" stroke-opacity=".28" stroke-dasharray="3 6"/>
      <text x="500" y="351" fill="#8cecff" font-size="11" font-weight="700" letter-spacing="2">03</text>
      <text x="500" y="372" fill="#effcff" font-size="17" font-weight="700">AI LAB</text>
    </g>
    <g>
      <circle cx="170" cy="210" r="52" fill="#12384c" stroke="#62dff8" stroke-width="1.8"/>
      <circle cx="170" cy="210" r="43" fill="none" stroke="#8cecff" stroke-opacity=".28" stroke-dasharray="3 6"/>
      <text x="170" y="203" fill="#8cecff" font-size="11" font-weight="700" letter-spacing="2">04</text>
      <text x="170" y="224" fill="#effcff" font-size="14" font-weight="700">SOFTWARE</text>
    </g>
  </g>

  <g filter="url(#glow)">
    <circle cx="500" cy="210" r="82" fill="url(#core)" stroke="#83eaff" stroke-width="2"/>
    <circle cx="500" cy="210" r="70" fill="none" stroke="#8cecff" stroke-opacity=".35" stroke-dasharray="3 7"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="500" y="202" fill="#a8f0ff" font-size="12" font-weight="700" letter-spacing="3">EXXHYPEX</text>
    <text x="500" y="225" fill="#ffffff" font-size="19" font-weight="800" letter-spacing="1">TECH ORBIT</text>
    <text x="500" y="245" fill="#9dbdcc" font-size="10" letter-spacing="2">EXPLORE · EXPERIMENT · BUILD</text>
  </g>

  <!-- Moving signal; the complete orbit remains legible without animation. -->
  <circle r="5" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="12s" repeatCount="indefinite" path="M170 210 A330 148 0 1 1 830 210 A330 148 0 1 1 170 210"/>
  </circle>
</svg>